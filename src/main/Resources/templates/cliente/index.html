<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alsha Group | Creamos, diseñamos y arreglamos tu página web</title>
    <!-- Vinculamos la hoja de estilos estática -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-brand">
            <!-- Logo AG -->
            <img th:src="@{/imagenes/logo.jpeg}" alt="Alsha Group Logo" class="logo-img">
            <div class="brand-text">
                <span class="company-name">ALSHA GROUP</span>
                <span class="tagline">creamos | diseñamos | arreglamos tu página web</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#nosotros">Nosotros</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Clientes</a>
        </nav>
    </header>

    <!-- SECCIÓN HERO (PRINCIPAL) -->
    <section class="hero">
        <div class="hero-content">
            <h1>Nos enfocamos en hacer crecer tu marca personal. Desarrollamos soluciones a tu medida.</h1>
            <a href="#contacto" class="btn-impulsa">¡Impulsar! 🚀</a>
        </div>
    </section>

</body>
</html>
